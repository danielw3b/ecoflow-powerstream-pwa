<svg version="1.1" xmlns="http://w3.org" viewBox="0 0 500 500" width="500" height="500">
  <style>
    .bg { fill: #060c1a; }
    .logo { fill: #ffb42c; }
  </style>
  
  <!-- Perfekt abgerundeter Hintergrund (App-Icon-Stil) -->
  <rect class="bg" width="500" height="500" rx="109.4" ry="109.4" />
  
  <!-- Das exakt ausgerichtete geometrische EF-Logo -->
  <g class="logo" transform="translate(100, 156)">
    <!-- E-Balken (Links) -->
    <rect x="0" y="0" width="143" height="34" />
    <rect x="0" y="76" width="143" height="34" />
    <rect x="0" y="152" width="143" height="34" />
    
    <!-- F-Balken (Rechts) -->
    <rect x="159" y="0" width="141" height="34" />
    <!-- Der abgewinkelte F-Haken (Kombination aus horizontalem und vertikalem Balken) -->
    <path d="M 159,76 H 300 V 110 H 201 V 186 H 159 Z" />
  </g>
</svg>







