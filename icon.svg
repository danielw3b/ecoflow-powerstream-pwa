<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Use a clipping mask to cleanly punch the inner circle hole out of the sun rays -->
    <clipPath id="sun-cutout-mask">
      <path d="M 0,0 H 500 V 500 H 0 Z M 250,250 m -125,0 a 125,125 0 1,1 250,0 a 125,125 0 1,1 -250,0" />
    </clipPath>
  </defs>

  <!-- Outer sun rays component with the clipping mask applied -->
  <polygon points="250,10 295.3,63.14 370,30 378.18,108.97 455.69,84.31 433.01,157.5 490,211.24 441.2,267.14 467.42,339.71 398.91,367.5 398.91,445.41 329.71,445.41 295.3,499.71 232.86,471.42 170,490 151.09,414.31 76.41,411.09 81.09,334.31 10,306.91 44.59,239.71 10,172.5 76.41,165.69 76.41,88.91 145.41,92.18 170,16.99 232.86,38.59" fill="#FDB833" clip-path="url(#sun-cutout-mask)" />

  <!-- Centered lightning bolt element -->
  <polygon points="260,150 180,280 235,280 242,370 320,230 265,230" fill="#FDB833" />
</svg>







