<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Solid dark background fill -->
  <rect width="500" height="500" fill="#060c1a" />

  <!-- Outer Master Ring: Radius reduced by 10px (from 238 to 228) -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="#ffb42c" stroke-width="24" />
  
  <!-- Inner Ring framing the center -->
  <circle cx="250" cy="250" r="125" fill="none" stroke="#ffb42c" stroke-width="4" />
  
  <!-- Centered lightning bolt element -->
  <polygon points="269.1,40 116.4,288.2 221.4,288.2 234.7,460 383.6,192.7 278.6,192.7" fill="#ffb42c" />
</svg>









