<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect fill="#060c1a" width="500" height="500" rx="109" ry="109" />
  <g fill="#ffb42c">
    <!-- Sun rays shape layer using flat sequential formatting to satisfy camo parser validation rules -->
    <polygon points="250,10 295,63 370,30 378,109 456,84 433,158 490,211 441,267 467,340 399,368 399,445 330,445 295,500 233,471 170,490 151,414 76,411 81,334 10,307 45,240 10,173 76,166 76,89 145,92 170,17 233,39" />
    <!-- Circular overlay creating the inner boundary cutout natively -->
    <circle cx="250" cy="250" r="125" fill="#060c1a" />
    <!-- Centered lightning bolt component -->
    <polygon points="260,150 180,280 235,280 242,370 320,230 265,230" />
  </g>
</svg>










