            <div class="legend-group">
                <span class="legend-title">🌤️ Weather Micro-Context</span>
                <div class="legend-items">
                    <span>⛅ ☀️ Partly Cloudy</span>
                    <span>☁️ ⛅ Overcast & Sun Breaks</span>
                    <span>☁️ ☁️ Overcast & Diffuse</span>
                    <span>🌧️ ☁️ Heavy Cloud / Rain</span>
                    <span>☁️ 🌫️ High Diffuse Light</span>
                    <span>🌡️ 🥵 Heat Derating (&ge;33&deg;C)</span>
                    <span>📶 ⚠️ Connection Drop</span>
                    <span>❌ 🔌 Hardware Drop</span>
                </div>
            </div>
        
            <div class="legend-group legend-footer">
                <div><strong>📊 Panel Baselines:</strong> Bifacial (${useGtiModel ? '13.5' : '14.0'}%+) & Standard Mono (${useGtiModel ? '7.5' : '8.0'}%+).</div>
                <div><strong>🔬 Solar Methodology:</strong> ${useGtiModel ? 'Global Tilted Radiation (GTI) mapping.' : 'Liu & Jordan (1960) empirical regression principles.'}</div>
            </div>
        </div>`;
        
        globalCsvRows = [
            ...csvHeader,
            ...csvSummary,
            ...csvFinancial,
            ...csvDaily,
            [],
            ...csvAnomalies
        ];
        
        resultsDiv.innerHTML = html;
        
        // Build anomalies lookup map for chart color highlights
        const anomaliesMap = {};
        anomalies.forEach(a => {
            anomaliesMap[a.date] = {
                isCritical: a.reason.includes("Outage") || a.reason.includes("Drop") || a.reason.includes("Failure"),
                isWarning: a.reason.includes("Loss") || a.reason.includes("Derating") || a.reason.includes("Cloud")
            };
        });

        // Choose correct array depending on global model switch
        const activeRadArray = useGtiModel ? radSumRaw : ljRadSumRaw;
        
        // Render chart with selected radiation model data
        renderChart('day', dates, activeRadArray, deviceDaily, anomaliesMap);
    
    }

    const RELATIVE_SEASONAL_PROFILE = {
        0: 1.20, 1: 1.15, 2: 1.05, 3: 0.95, 4: 0.88, 5: 0.82,
        6: 0.80, 7: 0.85, 8: 0.92, 9: 1.02, 10: 1.12, 11: 1.24
    };
    
    function getPeriodSeasonalWeight(startDate, endDate) {
        let cumulativeWeight = 0;
        let currentDate = new Date(startDate);
    
        while (currentDate <= endDate) {
            cumulativeWeight += (RELATIVE_SEASONAL_PROFILE[currentDate.getMonth()] || 1.0);
            currentDate.setDate(currentDate.getDate() + 1);
        }
    
        return cumulativeWeight;
    }

    function showNextRows(btn, step = 30) {
        const frame = btn.previousElementSibling;
        if (!frame) return;
    
        const hiddenRows = Array.from(frame.querySelectorAll('tr.hidden-row'));
        const toShow = hiddenRows.slice(0, step);
    
        toShow.forEach(row => row.classList.remove('hidden-row'));
    
        const remaining = hiddenRows.length - toShow.length;
        if (remaining > 0) {
            btn.textContent = `Show More (${remaining} remaining)`;
        } else {
            btn.style.display = 'none';
        }
    }

    // Global State for Charting
    let activeChartData = null;
    let currentPeriod = 'day';
    let dayPageOffset = 0;
    
    /**
     * Switch active chart period mode (day, month, year)
     * @param {string} period - Selected view period
     */
    function setChartPeriod(period) {
        currentPeriod = period;
        if (period === 'day') {
            dayPageOffset = 0;
        }
        
        document.querySelectorAll('.chart-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-chart-${period}`);
        if (activeBtn) {
            activeBtn.classList.add('active');
        }
    
        if (activeChartData) {
            renderChart(
                period, 
                activeChartData.dates, 
                activeChartData.radData, 
                activeChartData.deviceDaily, 
                activeChartData.anomaliesMap
            );
        }
    }
    
    /**
     * Change the active 30-day window for daily view pagination
     * @param {number} direction - Offset direction (+1 older, -1 newer)
     */
    function changeDayPage(direction) {
        if (!activeChartData || !activeChartData.dates) return;
        
        const pageSize = 30;
        const totalDates = activeChartData.dates.length;
        const maxOffset = Math.max(0, Math.ceil(totalDates / pageSize) - 1);
    
        dayPageOffset = Math.min(maxOffset, Math.max(0, dayPageOffset + direction));
    
        if (activeChartData) {
            renderChart(
                currentPeriod,
                activeChartData.dates,
                activeChartData.radData,
                activeChartData.deviceDaily,
                activeChartData.anomaliesMap
            );
        }
    }
    
    /**
     * Render HTML5 Canvas Chart with stacked status bars for Month/Year
     */
    function renderChart(period, dates, radData, deviceDaily, anomaliesMap = {}) {
        activeChartData = { dates, radData, deviceDaily, anomaliesMap };
    
        // Toggle visibility of day pagination container based on active view mode
        const isDailyView = (period === 'day' || !period);
        const paginationContainer = document.getElementById('dayPaginationControls');
        if (paginationContainer) {
            paginationContainer.style.display = isDailyView ? 'inline-flex' : 'none';
        }
    
        const canvas = document.getElementById('analyzerChart');
        if (!canvas) return;
    
        const container = canvas.parentElement;
        const W = container ? container.clientWidth : 300;
        const H = container ? container.clientHeight : 220;
    
        const dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
    
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
    
        const PL = 45, PR = 40, PT = 20, PB = 30;
        const cW = W - PL - PR;
        const cH = H - PT - PB;
    
        ctx.clearRect(0, 0, W, H);
        if (!dates || dates.length === 0) return;
    
        let displayDates = [];
        let displayYields = [];
        let displayRad = [];
        let displayAnomalies = {};
    
        const checkAnomaly = (a) => {
            if (!a) return { isCritical: false, isWarning: false };
            const isCritical = a.isCritical || a.severity === 'critical' || a.type === 'outage';
            const isWarning = a.isWarning || a.severity === 'warning' || a.type === 'clouded' || a.type === 'low_efficiency';
            return { isCritical, isWarning };
        };
    
        if (period === 'year') {
            const yearlyMap = {};
            dates.forEach((d, idx) => {
                const yearKey = d.substring(0, 4);
                if (!yearlyMap[yearKey]) {
                    yearlyMap[yearKey] = { yieldWh: 0, radSum: 0, totalDays: 0, normalDays: 0, warningDays: 0, criticalDays: 0 };
                }
                yearlyMap[yearKey].yieldWh += (deviceDaily[d] || 0);
                yearlyMap[yearKey].radSum += (radData[idx] || 0);
                yearlyMap[yearKey].totalDays++;
    
                const st = checkAnomaly(anomaliesMap[d]);
                if (st.isCritical) yearlyMap[yearKey].criticalDays++;
                else if (st.isWarning) yearlyMap[yearKey].warningDays++;
                else yearlyMap[yearKey].normalDays++;
            });
    
            displayDates = Object.keys(yearlyMap).sort();
            displayYields = displayDates.map(y => yearlyMap[y].yieldWh / 1000);
            displayRad = displayDates.map(y => yearlyMap[y].radSum);
            displayDates.forEach(y => {
                displayAnomalies[y] = yearlyMap[y];
            });
    
        } else if (period === 'month') {
            const monthlyMap = {};
            dates.forEach((d, idx) => {
                const monthKey = d.substring(0, 7);
                if (!monthlyMap[monthKey]) {
                    monthlyMap[monthKey] = { yieldWh: 0, radSum: 0, totalDays: 0, normalDays: 0, warningDays: 0, criticalDays: 0 };
                }
                monthlyMap[monthKey].yieldWh += (deviceDaily[d] || 0);
                monthlyMap[monthKey].radSum += (radData[idx] || 0);
                monthlyMap[monthKey].totalDays++;
    
                const st = checkAnomaly(anomaliesMap[d]);
                if (st.isCritical) monthlyMap[monthKey].criticalDays++;
                else if (st.isWarning) monthlyMap[monthKey].warningDays++;
                else monthlyMap[monthKey].normalDays++;
            });
    
            displayDates = Object.keys(monthlyMap).sort();
            displayYields = displayDates.map(m => monthlyMap[m].yieldWh / 1000);
            displayRad = displayDates.map(m => monthlyMap[m].radSum);
            displayDates.forEach(m => {
                displayAnomalies[m] = monthlyMap[m];
            });
    
        } else {
            // Daily View with bounded 30-day pagination slice
            const pageSize = 30;
            const totalDates = dates.length;
            
            const endIndex = Math.max(pageSize, totalDates - (dayPageOffset * pageSize));
            const startIndex = Math.max(0, endIndex - pageSize);
    
            displayDates = dates.slice(startIndex, endIndex);
            displayRad = radData.slice(startIndex, endIndex);
            displayYields = displayDates.map(d => ((deviceDaily[d] || 0) / 1000));
            
            displayDates.forEach(d => {
                displayAnomalies[d] = checkAnomaly(anomaliesMap[d]);
            });
    
            // Update range label in DOM for daily view
            const rangeLabel = document.getElementById('chartDateRange');
            if (rangeLabel && displayDates.length > 0) {
                const startStr = displayDates[0];
                const endStr = displayDates[displayDates.length - 1];
                rangeLabel.textContent = (startStr === endStr) ? startStr : `${startStr} - ${endStr}`;
            }
        }
    
        const count = displayDates.length;
        if (count === 0) return;
    
        const maxYield = Math.max(...displayYields, 0.1);
        const maxRad = Math.max(...displayRad, 0.1);
    
        const stepX = cW / count;
        const rawBarWidth = stepX - 2;
        const barWidth = Math.min(Math.max(1, rawBarWidth), period === 'day' ? 6 : 14);
    
        // Gridlines & Axes
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1;
        ctx.font = "9px monospace";
    
        const steps = 4;
        for (let i = 0; i <= steps; i++) {
            const y = PT + (cH * i / steps);
    
            ctx.beginPath();
            ctx.moveTo(PL, y);
            ctx.lineTo(W - PR, y);
            ctx.stroke();
    
            // Left Y-Axis: Yield (kWh)
            const yieldVal = (maxYield * (1 - i / steps)).toFixed(1);
            ctx.fillStyle = "rgba(52, 211, 153, 0.85)";
            ctx.textAlign = "right";
            ctx.fillText(`${yieldVal}k`, PL - 6, y + 3);
    
            // Right Y-Axis: Radiation (kWh/m²)
            const radVal = (maxRad * (1 - i / steps)).toFixed(1);
            ctx.fillStyle = "#38bdf8";
            ctx.textAlign = "left";
            ctx.fillText(radVal, W - PR + 6, y + 3);
        }
    
        // Yield Bars Rendering
        const todayStr = new Date().toISOString().split('T')[0];
    
        for (let i = 0; i < count; i++) {
            const dateKey = displayDates[i];
            const val = displayYields[i];
            const barHeight = (val / maxYield) * cH;
            const x = PL + (i * stepX) + (stepX - barWidth) / 2;
            const y = PT + cH - barHeight;
    
            const anomalyData = displayAnomalies[dateKey];
    
            if (period === 'month' || period === 'year') {
                // Multi-color stacked bars based on day ratios
                const total = anomalyData?.totalDays || 1;
                const normRatio = (anomalyData?.normalDays || 0) / total;
                const warnRatio = (anomalyData?.warningDays || 0) / total;
                const critRatio = (anomalyData?.criticalDays || 0) / total;
    
                let currentY = y + barHeight;
    
                // Draw critical section (Red - Top)
                if (critRatio > 0) {
                    const segH = barHeight * critRatio;
                    currentY -= segH;
                    ctx.fillStyle = "#ef4444";
                    ctx.fillRect(x, currentY, barWidth, segH);
                }
    
                // Draw warning section (Orange - Middle)
                if (warnRatio > 0) {
                    const segH = barHeight * warnRatio;
                    currentY -= segH;
                    ctx.fillStyle = "#f59e0b";
                    ctx.fillRect(x, currentY, barWidth, segH);
                }
    
                // Draw normal section (Green - Bottom)
                if (normRatio > 0) {
                    const segH = barHeight * normRatio;
                    currentY -= segH;
                    ctx.fillStyle = "rgba(52, 211, 153, 0.85)";
                    ctx.fillRect(x, currentY, barWidth, segH);
                }
            } else {
                // Single-day status bar coloring
                if (anomalyData && anomalyData.isCritical) {
                    ctx.fillStyle = "#ef4444";
                } else if (anomalyData && anomalyData.isWarning) {
                    ctx.fillStyle = "#f59e0b";
                } else {
                    ctx.fillStyle = "rgba(52, 211, 153, 0.85)";
                }
    
                ctx.fillRect(x, y, barWidth, barHeight);
            }
    
            // X-Axis Labels
            const labelStep = count > 30 ? 5 : (count > 15 ? 3 : (count > 7 ? 2 : 1));
            if (i % labelStep === 0 || i === count - 1) {
                const isLatest = (i === count - 1) && (period !== 'day' || dayPageOffset === 0);;
                
                ctx.fillStyle = isLatest ? "#34d399" : "#94a3b8";
                ctx.font = isLatest ? "bold 9px monospace" : "9px monospace";
                ctx.textAlign = "center";
    
                let dispLabel = dateKey;
                if (period === 'day' || !period) {
                    dispLabel = dateKey.length >= 10 ? dateKey.slice(8, 10) : dateKey;
                } else if (period === 'month') {
                    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    const monthIdx = parseInt(dateKey.slice(5, 7), 10) - 1;
                    dispLabel = months[monthIdx] ?? dateKey.slice(5);
                } else if (period === 'year') {
                    dispLabel = dateKey.substring(0, 4);
                }
    
                ctx.fillText(dispLabel, x + barWidth / 2, H - 8);
            }
        }
    
        // Radiation Trend Line
        ctx.beginPath();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 1.5;
    
        for (let i = 0; i < count; i++) {
            const radVal = displayRad[i] || 0;
            const x = PL + (i * stepX) + stepX / 2;
            const y = PT + cH - ((radVal / maxRad) * cH);
    
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    
        for (let i = 0; i < count; i++) {
            const radVal = displayRad[i] || 0;
            const x = PL + (i * stepX) + stepX / 2;
            const y = PT + cH - ((radVal / maxRad) * cH);
    
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function renderFinancialReportHtml(deviceDaily = {}, csvFinancialBlock = []) {
        let totalGeneratedWh = 0;
        const tariffStartDate = new Date(globalConfig.tariffStart);
        tariffStartDate.setHours(0, 0, 0, 0);
    
        const endDateObj = new Date();
        endDateObj.setDate(endDateObj.getDate() - 1);
        endDateObj.setHours(0, 0, 0, 0);
    
        const diffTime = endDateObj.getTime() - tariffStartDate.getTime();
        const tariffDaysCounter = Math.max(1, Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1);
    
        for (const [dateStr, wh] of Object.entries(deviceDaily)) {
            const entryDate = new Date(dateStr);
            entryDate.setHours(0, 0, 0, 0);
            
            if (entryDate >= tariffStartDate && entryDate <= endDateObj) {
                totalGeneratedWh += wh;
            }
        }
    
        const totalGeneratedKwh = totalGeneratedWh / 1000;
        const selfConsumptionRate = globalConfig.selfConsumptionRate !== undefined ? globalConfig.selfConsumptionRate : 75;
        const savedKwh = totalGeneratedKwh * (selfConsumptionRate / 100);
    
        const energyPrice = globalConfig.energyPrice || 0;
        const investment = globalConfig.investment || 0;
    
        const meterStart = globalConfig.meterTariffStart || 0;
        const meterCurrent = globalConfig.meterCurrent || 0;
        const meterDelta = Math.max(0, meterCurrent - meterStart);
    
        const theoryDemand = meterDelta + savedKwh;
        const dailyGridOnlyDemand = meterDelta / tariffDaysCounter;
        const dailyTotalDemand = theoryDemand / tariffDaysCounter;
    
        const totalSeasonalWeight = getPeriodSeasonalWeight(tariffStartDate, endDateObj);
        const baseDailyDemand = totalSeasonalWeight > 0 ? (theoryDemand / totalSeasonalWeight) : dailyTotalDemand;
        const estimatedAnnualDemand = baseDailyDemand * 365;
    
        const cur = globalConfig.currency || '€';
        const savingsNet = savedKwh * (energyPrice / 100);
        const autarkyRate = theoryDemand > 0 ? (savedKwh / theoryDemand) * 100 : 0;
        const roiPercent = investment > 0 ? (savingsNet / investment) * 100 : 0;
    
        csvFinancialBlock.push(["=== FINANCIAL REPORT: MEASURED DATA ==="]);
        csvFinancialBlock.push(["Tariff Start", globalConfig.tariffStart, "Tariff Days Tracked", tariffDaysCounter]);
        csvFinancialBlock.push(["Meter Start (kWh)", meterStart.toFixed(1).replace('.', ',')]);
        csvFinancialBlock.push(["Meter Current (kWh)", meterCurrent.toFixed(1).replace('.', ',')]);
        csvFinancialBlock.push(["Grid Import (kWh)", meterDelta.toFixed(1).replace('.', ',')]);
        csvFinancialBlock.push(["Total Generated (kWh)", totalGeneratedKwh.toFixed(2).replace('.', ',')]);
        csvFinancialBlock.push(["Direct Solar Used (kWh)", savedKwh.toFixed(2).replace('.', ',')]);
        csvFinancialBlock.push(["Total Household Demand (kWh)", theoryDemand.toFixed(1).replace('.', ',')]);
        csvFinancialBlock.push(["Daily Grid Import (with PV) (kWh)", dailyGridOnlyDemand.toFixed(2).replace('.', ',')]);
        csvFinancialBlock.push(["Daily elec. Need (without PV) (kWh)", dailyTotalDemand.toFixed(2).replace('.', ',')]);
        csvFinancialBlock.push(["Realized Autarky Rate (%)", autarkyRate.toFixed(1).replace('.', ',')]);
        csvFinancialBlock.push(["Total Net Savings (" + cur + ")", savingsNet.toFixed(2).replace('.', ',')]);
        csvFinancialBlock.push(["ROI Progress (%)", roiPercent.toFixed(1).replace('.', ',')]);
        csvFinancialBlock.push([]);
        csvFinancialBlock.push(["=== MODEL EXTRAPOLATIONS (SLP H0 PROFILE) ==="]);
        csvFinancialBlock.push(["Normalized Base Daily Usage (kWh)", baseDailyDemand.toFixed(2).replace('.', ',')]);
        csvFinancialBlock.push(["Est. Annual Household Demand (kWh)", estimatedAnnualDemand.toFixed(0)]);
        csvFinancialBlock.push([]);
    
        return `<div class="summary-card mt-15">
            <h3>💰 Financial & ROI Report</h3>
            <table>
                <thead>
                    <!--<tr><th>Metric</th><th>Value</th><th class="text-left">Context</th></tr>-->
                    <tr><th colspan="3" class="text-left">📋 Measured Historical Data</th></tr>
                </thead>
                <tbody>
                    <tr><td>Tariff Days Tracked</td><td>${tariffDaysCounter} Days</td><td class="text-left">From ${globalConfig.tariffStart} up to yesterday</td></tr>
                    <tr><td>Grid Import (Meter)</td><td class="warn">${meterDelta.toFixed(1)} kWh</td><td class="text-left">Current (${meterCurrent}) - Start (${meterStart})</td></tr>
                    <tr><td>Total Generated (PV)</td><td>${totalGeneratedKwh.toFixed(2)} kWh</td><td class="text-left">Inverter production since tariff start</td></tr>
                    <tr><td>Direct Solar Usage</td><td class="good">${savedKwh.toFixed(2)} kWh</td><td class="text-left">${selfConsumptionRate}% direct self-consumption rate</td></tr>
                    <tr><td>Total Household Demand</td><td><b>${theoryDemand.toFixed(1)} kWh</b></td><td class="text-left">Real total demand (Grid import + Solar used)</td></tr>
                    <tr><td>Daily Import (w/ PV)</td><td class="good">${dailyGridOnlyDemand.toFixed(2)} kWh</td><td class="text-left">Daily net grid import w/ solar</td></tr>
                    <tr><td>Daily elec. Need (w/out PV)</td><td class="warn">${dailyTotalDemand.toFixed(2)} kWh</td><td class="text-left">Daily grid need w/out solar</td></tr>
                    <tr><td>Realized Autarky Rate</td><td class="good">${autarkyRate.toFixed(1)}%</td><td class="text-left">Solar share of ${theoryDemand.toFixed(0)} kWh total demand</td></tr>
                    <tr><td>Total Net Savings</td><td class="good">${savingsNet.toFixed(2)} ${cur}</td><td class="text-left">Direct electricity bill reduction</td></tr>
                    <tr><td>ROI Progress</td><td class="good">${roiPercent.toFixed(1)}%</td><td class="text-left">Of ${cur}${investment} total investment</td></tr>
                </tbody>
                <thead>
                    <tr><th colspan="3" class="text-left">🔮 Extrapolations & Models</th></tr>
                </thead>
                <tbody>
                    <tr><td>Norm. Base Daily Usage</td><td>${baseDailyDemand.toFixed(2)} kWh</td><td class="text-left">Seasonally adjusted daily base [SLP H0]</td></tr>
                    <tr><td>Est. Annual House Demand</td><td><b>${estimatedAnnualDemand.toFixed(0)} kWh</b></td><td class="text-left">Projected 365-day demand based on seasonal weight</td></tr>
                </tbody>
            </table>
        </div>`;
    }

    function sanitizeCsvCell(value) {
        if (value === null || value === undefined) return "";
        let str = String(value);
        if (str.includes('"')) str = str.replace(/"/g, '""');
        if (/[;\n\r"]/.test(str)) str = `"${str}"`;
        return str;
    }
    
    function downloadCSV() {
        if (!Array.isArray(globalCsvRows) || globalCsvRows.length === 0) {
            alert("No analysis data available for export! Please run the analysis first.");
            return;
        }
    
        const csvContent = "\uFEFF" + globalCsvRows
            .map(row => row.map(sanitizeCsvCell).join(";"))
            .join("\n");
            
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        const inverterSelect = document.getElementById('cfg_inverter');
        const inverterName = (inverterSelect && inverterSelect.value) ? inverterSelect.value : "Unknown_Device";
        const startDateStr = (typeof globalConfig !== "undefined" && globalConfig?.startDate) ? globalConfig.startDate : "All_Time";
        
        link.href = url;
        link.download = `Solar_Analysis_${useGtiModel ? 'GTI-Model' : 'Liu-Jordan-Model'}_${inverterName}_${startDateStr}.csv`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    
        setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    const scrollToTopBtn = document.getElementById('scrollToTopBtn');
    
    const handleScroll = () => {
        if (!scrollToTopBtn) return;
        const threshold = Math.min(Math.max(window.innerHeight, 400), 600);
        if (window.scrollY > threshold) {
            scrollToTopBtn.classList.add('show');
        } else {
            scrollToTopBtn.classList.remove('show');
        }
    };
    
    window.addEventListener('scroll', handleScroll, { passive: true });
    
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        initInverters();
        
        // Secret 7-click unlock handler
        document.getElementById('syncActionHeader').addEventListener('click', () => {
          clickCounter++;
          clearTimeout(clickTimer);
          
          if (clickCounter === 7) {
            document.getElementById('credentialsArea').classList.toggle('hidden');
            clickCounter = 0;
          } else {
            clickTimer = setTimeout(() => { clickCounter = 0; }, 2000);
          }
        });
    });    
</script>
