  <title>EcoFlow PWA — Gist Sync Prototype</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #161f30;
      --border: #233148;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --btn-bg: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 12px 0;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: monospace;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .keys-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .key-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      overflow: auto;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 120px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .hidden { display: none !important; }
    
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-info { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    .summary-table td {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border);
    }
    .summary-table td:last-child {
      text-align: right;
      font-family: monospace;
    }
    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>☁️ EcoFlow Gist Sync</h1>
  <div class="subtitle">Cloud Synchronization & LocalStorage Merge Tool</div>

  <form id="gistForm" autocomplete="on" onsubmit="return false;">
    
    <!-- Credentials Card -->
    <div class="card">
      <h2>🔐 Credentials</h2>
      
      <div class="form-group">
        <label for="gistId">GitHub Gist ID (Required for Import & Export)</label>
        <input type="text" id="gistId" name="username" autocomplete="username" placeholder="e.g. 7f8a9b0c1d2e3f4a..." required>
      </div>

      <div class="form-group">
        <label for="gistToken">GitHub Personal Access Token (Master device only)</label>
        <input type="password" id="gistToken" name="password" autocomplete="current-password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>

      <label class="checkbox-option">
        <input type="checkbox" id="saveCredentialsCheck" checked>
        <span>Save Credentials locally in LocalStorage</span>
      </label>
    </div>

    <!-- Backup & Format Options -->
    <div class="card">
      <h2>📦 Select LocalStorage Keys & Format</h2>
      <div id="keysContainer" class="keys-grid">
        <!-- Dynamically rendered keys -->
      </div>

      <label class="checkbox-option">
        <input type="checkbox" id="useGzipCompression">
        <span>Compress Backup with Gzip (Base64 encoded)</span>
      </label>
    </div>

    <!-- Actions & Sync Controls -->
    <div class="card">
      <h2>⚡ Sync Controls</h2>
      
      <div style="margin-bottom: 8px; font-size: 0.85rem;">
        <span>Local Sync Date:</span> 
        <strong id="localTimestampDisplay" style="font-family: monospace;">Never</strong>
      </div>

      <div style="margin-bottom: 12px; font-size: 0.85rem;">
        <span>Gist Cloud Stand:</span> 
        <strong id="gistTimestampDisplay" style="font-family: monospace;">Not checked</strong>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-secondary" onclick="checkGistStatus()">🔍 Check Status</button>
        <button type="button" id="exportBtn" class="btn-primary" onclick="exportToGist()">📤 Export to Gist</button>
        <button type="button" id="importBtn" class="btn-primary hidden" onclick="importFromGist()" style="background: #3b82f6;">📥 Import & Merge</button>
      </div>
    </div>

  </form>

  <!-- HTML Action Summary -->
  <div id="summaryCard" class="card hidden">
    <h2>📊 Action Summary</h2>
    <div id="summaryContent"></div>
  </div>
</div>

<script>
  // Key names used internally for sync status and local credentials
  const LOCAL_SYNC_KEY = 'ecoflow_gist_last_sync';
  const CRED_GIST_ID = 'ecoflow_gist_id';
  const CRED_GIST_TOKEN = 'ecoflow_github_token';

  // Strict exclusion list: Sensitive API keys, local credentials, and device names are excluded
  const EXCLUDED_KEYS = [
    'ecoflow_accesskey',
    'ecoflow_secretkey',
    'accesskey',
    'secretkey',
    'ecoflow_name',
    'ecoflow_names',
    'ecoflow_gist_id',
    'ecoflow_github_token',
    CRED_GIST_ID,
    CRED_GIST_TOKEN,
    LOCAL_SYNC_KEY
  ];

  document.addEventListener('DOMContentLoaded', () => {
    loadCredentials();
    renderKeySelection();
    updateTimestampDisplays();

    document.getElementById('gistToken').addEventListener('input', updateButtonStates);
    document.getElementById('gistId').addEventListener('input', updateButtonStates);
    
    updateButtonStates();
  });

  /**
   * Load stored credentials from LocalStorage
   */
  function loadCredentials() {
    const savedId = localStorage.getItem(CRED_GIST_ID);
    const savedToken = localStorage.getItem(CRED_GIST_TOKEN);

    if (savedId) document.getElementById('gistId').value = savedId;
    if (savedToken) document.getElementById('gistToken').value = savedToken;
  }

  /**
   * Save credentials to LocalStorage if user checked the option
   */
  function persistCredentials(gistId, token) {
    const shouldSave = document.getElementById('saveCredentialsCheck').checked;
    if (shouldSave) {
      if (gistId) localStorage.setItem(CRED_GIST_ID, gistId);
      if (token) localStorage.setItem(CRED_GIST_TOKEN, token);
    }
  }

  /**
   * Filter and render selectable LocalStorage keys, skipping all excluded keys
   */
  function renderKeySelection() {
    const container = document.getElementById('keysContainer');
    container.innerHTML = '';

    const validKeys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (EXCLUDED_KEYS.includes(key)) continue;
      
      if (key.startsWith('ecoflow_') || key.startsWith('inverter_cfg_')) {
        validKeys.push(key);
      }
    }

    if (validKeys.length === 0) {
      container.innerHTML = '<div style="font-size:0.8rem; color:var(--text-dim);">No EcoFlow keys found in LocalStorage.</div>';
      return;
    }

    validKeys.forEach(key => {
      const item = document.createElement('label');
      item.className = 'key-item';
      item.innerHTML = `
        <input type="checkbox" value="${key}" checked>
        <span title="${key}">${key}</span>
      `;
      container.appendChild(item);
    });
  }

  /**
   * Update local timestamp UI
   */
  function updateTimestampDisplays() {
    const localTs = localStorage.getItem(LOCAL_SYNC_KEY);
    document.getElementById('localTimestampDisplay').textContent = localTs ? new Date(localTs).toLocaleString() : 'Never';
  }

  /**
   * Enable/Disable visual cues for export button based on token presence
   */
  function updateButtonStates() {
    const token = document.getElementById('gistToken').value.trim();
    const exportBtn = document.getElementById('exportBtn');

    if (!token) {
      exportBtn.style.opacity = '0.5';
      exportBtn.title = 'Personal Access Token required for Export (Master device mode)';
    } else {
      exportBtn.style.opacity = '1';
      exportBtn.title = '';
    }
  }

  /**
   * Get list of selected keys
   */
  function getSelectedKeys() {
    const checkboxes = document.querySelectorAll('#keysContainer input[type="checkbox"]:checked');
    return Array.from(checkboxes).map(cb => cb.value);
  }

  /**
   * Deep Smart Merge to protect nested historical solar datasets
   */
  function applySmartMerge(incomingData) {
    Object.keys(incomingData).forEach(key => {
      if (EXCLUDED_KEYS.includes(key)) return;
  
      const existingValue = localStorage.getItem(key);
      if (!existingValue) {
        const valStr = typeof incomingData[key] === 'object' ? JSON.stringify(incomingData[key]) : incomingData[key];
        localStorage.setItem(key, valStr);
        return;
      }
  
      try {
        const existingObj = JSON.parse(existingValue);
        const incomingObj = typeof incomingData[key] === 'string' ? JSON.parse(incomingData[key]) : incomingData[key];
  
        // Array Merge (e.g. historical log lists) -> Unique items
        if (Array.isArray(existingObj) && Array.isArray(incomingObj)) {
          const mergedArray = [...existingObj, ...incomingObj];
          const uniqueArray = Array.from(new Set(mergedArray.map(item => JSON.stringify(item)))).map(string => JSON.parse(string));
          localStorage.setItem(key, JSON.stringify(uniqueArray));
        } 
        // Deep Object Merge (SN -> Date -> Wh Yields)
        else if (typeof existingObj === 'object' && typeof incomingObj === 'object' && existingObj !== null && incomingObj !== null) {
          const mergedObj = { ...existingObj };
  
          Object.keys(incomingObj).forEach(snKey => {
            if (!mergedObj[snKey]) {
              mergedObj[snKey] = incomingObj[snKey];
            } else if (typeof mergedObj[snKey] === 'object' && typeof incomingObj[snKey] === 'object') {
              mergedObj[snKey] = { ...mergedObj[snKey] };
              Object.keys(incomingObj[snKey]).forEach(dateKey => {
                const localWh = Number(mergedObj[snKey][dateKey]) || 0;
                const incomingWh = Number(incomingObj[snKey][dateKey]) || 0;
                
                // Monotonicity Rule: Retain maximum accumulated Wh yield per day
                mergedObj[snKey][dateKey] = Math.max(localWh, incomingWh);
              });
            } else {
              mergedObj[snKey] = incomingObj[snKey];
            }
          });
  
          localStorage.setItem(key, JSON.stringify(mergedObj));
        } else {
          localStorage.setItem(key, typeof incomingData[key] === 'object' ? JSON.stringify(incomingData[key]) : incomingData[key]);
        }
      } catch (parseError) {
        // Fallback for non-JSON text values
        localStorage.setItem(key, incomingData[key]);
      }
    });
  }

  /**
   * Helper: Gzip compression
   */
  async function compressGzip(text) {
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    const response = new Response(stream);
    const buffer = await response.arrayBuffer();
    return btoa(String.fromCharCode(...new Uint8Array(buffer)));
  }

  /**
   * Helper: Gzip decompression
   */
  async function decompressGzip(base64String) {
    const binary = atob(base64String);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const response = new Response(stream);
    return await response.text();
  }

  /**
   * Query Gist metadata to check remote timestamp vs local timestamp
   */
  async function checkGistStatus() {
    const gistId = document.getElementById('gistId').value.trim();
    if (!gistId) {
      alert('Please enter a Gist ID to check status.');
      return null;
    }

    try {
      const response = await fetch(`https://api.github.com/gists/${gistId}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}: Gist not found or invalid ID`);

      const data = await response.json();
      const gistUpdatedAt = new Date(data.updated_at).getTime();
      const localSyncTs = localStorage.getItem(LOCAL_SYNC_KEY) ? new Date(localStorage.getItem(LOCAL_SYNC_KEY)).getTime() : 0;

      document.getElementById('gistTimestampDisplay').textContent = new Date(data.updated_at).toLocaleString();

      const importBtn = document.getElementById('importBtn');

      if (!localSyncTs || gistUpdatedAt > localSyncTs) {
        importBtn.classList.remove('hidden');
        renderSummary('Info', 'Newer Cloud data detected on Gist. Ready to import!', [
          ['Gist Updated', new Date(gistUpdatedAt).toLocaleString()],
          ['Local Sync', localSyncTs ? new Date(localSyncTs).toLocaleString() : 'None'],
          ['Status', '📥 Import Available']
        ]);
      } else {
        importBtn.classList.add('hidden');
        renderSummary('Success', 'Local data is up-to-date or newer than Gist.', [
          ['Gist Updated', new Date(gistUpdatedAt).toLocaleString()],
          ['Local Sync', new Date(localSyncTs).toLocaleString()],
          ['Status', '✅ Synced']
        ]);
      }

      return gistUpdatedAt;
    } catch (err) {
      renderSummary('Danger', `Failed to check Gist status: ${err.message}`, []);
      return null;
    }
  }

  /**
   * Export LocalStorage data to GitHub Gist with remote timestamp validation safety net
   */
  async function exportToGist() {
    const gistId = document.getElementById('gistId').value.trim();
    const token = document.getElementById('gistToken').value.trim();
    const selectedKeys = getSelectedKeys();
    const useGzip = document.getElementById('useGzipCompression').checked;

    if (!gistId || !token) {
      alert('Export requires both Gist ID and Personal Access Token!');
      return;
    }

    if (selectedKeys.length === 0) {
      alert('Please select at least one key to export.');
      return;
    }

    // Safety check: verify remote timestamp before overwriting Gist
    const remoteTimestamp = await checkGistStatus();
    const localSyncTs = localStorage.getItem(LOCAL_SYNC_KEY) ? new Date(localStorage.getItem(LOCAL_SYNC_KEY)).getTime() : 0;

    if (remoteTimestamp && remoteTimestamp > localSyncTs) {
      const confirmOverwrite = confirm(
        `⚠️ WARNING: The Gist has a newer update (${new Date(remoteTimestamp).toLocaleString()}) than your local sync state (${localSyncTs ? new Date(localSyncTs).toLocaleString() : 'Never'}).\n\nDo you really want to export and overwrite the Gist?`
      );
      if (!confirmOverwrite) {
        return; // User canceled export to prevent overwriting newer remote data
      }
    }

    persistCredentials(gistId, token);

    const payload = {
      timestamp: new Date().toISOString(),
      compressed: useGzip,
      keys: {}
    };

    selectedKeys.forEach(key => {
      const val = localStorage.getItem(key);
      if (val !== null) {
        try {
          payload.keys[key] = JSON.parse(val);
        } catch {
          payload.keys[key] = val;
        }
      }
    });

    let finalContent = JSON.stringify(payload, null, 2);
    if (useGzip) {
      finalContent = await compressGzip(finalContent);
    }

    const nowIso = new Date().toISOString();

    try {
      const response = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          description: `EcoFlow Backup - ${nowIso}`,
          files: {
            'ecoflow_backup.json': {
              content: finalContent
            }
          }
        })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.message || `HTTP ${response.status}`);
      }

      localStorage.setItem(LOCAL_SYNC_KEY, nowIso);
      updateTimestampDisplays();

      renderSummary('Success', 'Export to Gist completed successfully!', [
        ['Timestamp', new Date(nowIso).toLocaleString()],
        ['Exported Keys', selectedKeys.length],
        ['Format', useGzip ? 'Gzip (Base64)' : 'Raw JSON'],
        ['Size', `${(finalContent.length / 1024).toFixed(2)} KB`]
      ]);

      checkGistStatus();

    } catch (err) {
      renderSummary('Danger', `Export failed: ${err.message}`, []);
    }
  }

  /**
   * Import data from Gist using exact smart merge logic
   */
  async function importFromGist() {
    const gistId = document.getElementById('gistId').value.trim();
    if (!gistId) {
      alert('Gist ID is required for import.');
      return;
    }

    persistCredentials(gistId, null);

    try {
      const response = await fetch(`https://api.github.com/gists/${gistId}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();
      const backupFile = data.files['ecoflow_backup.json'];

      if (!backupFile) {
        throw new Error('File "ecoflow_backup.json" not found inside Gist.');
      }

      let contentStr = backupFile.content;
      let payload;

      try {
        payload = JSON.parse(contentStr);
        if (payload.compressed && typeof payload.keys === 'string') {
          const decompressed = await decompressGzip(payload.keys);
          payload = JSON.parse(decompressed);
        }
      } catch (e) {
        const decompressed = await decompressGzip(contentStr);
        payload = JSON.parse(decompressed);
      }

      // Execute exact smart merge logic
      applySmartMerge(payload.keys || {});

      const importTs = payload.timestamp || data.updated_at || new Date().toISOString();
      localStorage.setItem(LOCAL_SYNC_KEY, importTs);

      updateTimestampDisplays();
      renderKeySelection();

      renderSummary('Success', 'Import & Smart Merge completed cleanly!', [
        ['Backup Date', new Date(importTs).toLocaleString()],
        ['Keys Processed', Object.keys(payload.keys || {}).length],
        ['Status', '✅ LocalStorage Merged Cleanly']
      ]);

      document.getElementById('importBtn').classList.add('hidden');

    } catch (err) {
      renderSummary('Danger', `Import failed: ${err.message}`, []);
    }
  }

  /**
   * Render HTML Action Summary Card
   */
  function renderSummary(type, message, details) {
    const card = document.getElementById('summaryCard');
    const content = document.getElementById('summaryContent');
    
    card.classList.remove('hidden');
    const badgeClass = type === 'Success' ? 'badge-success' : type === 'Danger' ? 'badge-danger' : 'badge-info';

    let tableRows = details.map(([label, val]) => `
      <tr>
        <td>${label}</td>
        <td>${val}</td>
      </tr>
    `).join('');

    content.innerHTML = `
      <div style="margin-bottom: 10px;">
        <span class="status-badge ${badgeClass}">${type.toUpperCase()}</span>
        <span style="margin-left: 8px; font-weight: 500;">${message}</span>
      </div>
      ${details.length > 0 ? `<table class="summary-table">${tableRows}</table>` : ''}
    `;
  }
</script>

</body>
</html>
