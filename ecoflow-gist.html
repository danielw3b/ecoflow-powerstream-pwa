<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoFlow PWA — Gist Sync Prototype</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- SVG Favicon & Apple Touch Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM2I4MmY2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTE4IDEwYTUgNSAwIDAgMC05LjktMUE1IDUgMCAwIDAgMyAxNGE1IDUgMCAwIDAgNSA1aDEyYTQgNCAwIDAgMCAwLTh6Ii8+PHBhdGggZD0iTTE2IDEydjYiLz48cGF0aCBkPSJtOSA4IDMgLTMgMyAzIi8+PC9zdmc+" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM2I4MmY2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTE4IDEwYTUgNSAwIDAgMC05LjktMUE1IDUgMCAwIDAgMyAxNGE1IDUgMCAwIDAgNSA1aDEyYTQgNCAwIDAgMCAwLTh6Ii8+PHBhdGggZD0iTTE2IDEydjYiLz48cGF0aCBkPSJtOSA4IDMgLTMgMyAzIi8+PC9zdmc+" />

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* App Header Styling */
    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .app-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .app-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    .app-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 2px 0 0 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    /* Clean read-only headers without text selection or pointer cursors */
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-info { background: rgba(59, 130, 246, 0.2); color: var(--primary); }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .badge-master { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .summary-table td {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border);
      vertical-align: middle;
    }

    .summary-table td:last-child {
      text-align: right;
      font-family: monospace;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="text"], input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
      box-sizing: border-box;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.98); }
    .btn-success { background-color: var(--success); color: #000; }
    .btn-warning { background-color: var(--warning); color: #000; }
    .btn-disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; opacity: 0.6; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">

  <!-- Main App Header -->
  <div class="app-header">
    <img class="app-icon" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM2I4MmY2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTE4IDEwYTUgNSAwIDAgMC05LjktMUE1IDUgMCAwIDAgMyAxNGE1IDUgMCAwIDAgNSA1aDEyYTQgNCAwIDAgMCAwLTh6Ii8+PHBhdGggZD0iTTE2IDEydjYiLz48cGF0aCBkPSJtOSA4IDMgLTMgMyAzIi8+PC9zdmc+" alt="Cloud Icon">
    <div class="app-title">
      <h1>EcoFlow Gist Sync</h1>
      <p>Cloud Synchronization & LocalStorage Merge Tool</p>
    </div>
  </div>

  <!-- Fixed Height Status Box (Prevents Layout Shift) -->
  <div class="card" id="summaryCard">
    <div class="card-header">
      <div class="card-title">📊 Status</div>
      <div id="statusBadgeContainer">
        <span class="badge badge-info">CHECKING...</span>
      </div>
    </div>
    <div id="summaryContent">
      <div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 12px 0;">
        Fetching cloud and local metadata...
      </div>
    </div>
  </div>

  <!-- Sync Action Card -->
  <div class="card">
    <div class="card-header">
      <!-- 7-Click Unlock Trigger on Sync Action Header -->
      <div class="card-title" id="syncActionHeader" title="Click 7 times to unlock settings">
        ⚡ Sync Action
      </div>
      <span id="masterBadge" class="badge badge-master hidden">MASTER MODE</span>
    </div>

    <!-- Hidden Credentials Area (Unlocked via 7-Click) -->
    <div id="credentialsArea" class="hidden">
      <div class="form-group">
        <label for="gistId">Gist ID</label>
        <input type="text" id="gistId" placeholder="Enter GitHub Gist ID">
      </div>
      <div class="form-group">
        <label for="githubToken">GitHub Access Token (Master Only)</label>
        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
      </div>
    </div>

    <!-- Export Specific Options (Only visible when export is needed) -->
    <div id="exportOptionsArea" class="hidden">
      <div class="form-group">
        <label for="storageKeys">Storage Keys (Comma Separated)</label>
        <input type="text" id="storageKeys" value="ecoflow_wh_hourly, ecoflow_devices">
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="gzipCompress" checked>
        <label for="gzipCompress">Compress Backup with Gzip (Base64 encoded)</label>
      </div>
    </div>

    <!-- Dynamic Single Primary Action Button -->
    <div style="margin-top: 14px;">
      <button id="mainActionBtn" class="btn btn-disabled" disabled>
        ⏳ Checking Status...
      </button>
    </div>
  </div>

</div>

<script>
  const LOCAL_SYNC_KEY = 'ecoflow_gist_last_sync';
  let clickCounter = 0;
  let clickTimer = null;

  document.addEventListener('DOMContentLoaded', () => {
    loadSavedSettings();
    setupEventListeners();
    checkGistStatus();
  });

  function loadSavedSettings() {
    const savedGistId = localStorage.getItem('ecoflow_gist_id') || '';
    const savedToken = localStorage.getItem('ecoflow_github_token') || '';
    
    document.getElementById('gistId').value = savedGistId;
    document.getElementById('githubToken').value = savedToken;
  }

  function setupEventListeners() {
    // Save settings on change
    document.getElementById('gistId').addEventListener('change', (e) => {
      localStorage.setItem('ecoflow_gist_id', e.target.value.trim());
      checkGistStatus();
    });

    document.getElementById('githubToken').addEventListener('change', (e) => {
      localStorage.setItem('ecoflow_github_token', e.target.value.trim());
      adjustUIForRole();
      checkGistStatus();
    });

    // 7-Click Unlock Trigger on Sync Action Header
    document.getElementById('syncActionHeader').addEventListener('click', () => {
      clickCounter++;
      clearTimeout(clickTimer);
      
      if (clickCounter === 7) {
        const credsArea = document.getElementById('credentialsArea');
        credsArea.classList.toggle('hidden');
        clickCounter = 0;
      } else {
        clickTimer = setTimeout(() => { clickCounter = 0; }, 2000);
      }
    });
  }

  function adjustUIForRole() {
    const token = document.getElementById('githubToken').value.trim();
    const masterBadge = document.getElementById('masterBadge');
    
    if (token) {
      masterBadge.classList.remove('hidden');
    } else {
      masterBadge.classList.add('hidden');
    }
  }

  /**
   * Helper: Find the newest timestamp string in ecoflow_wh_hourly
   */
  function getLatestDataTimestamp() {
    const hourlyRaw = localStorage.getItem('ecoflow_wh_hourly');
    if (!hourlyRaw) return null;

    try {
      const hourlyData = JSON.parse(hourlyRaw);
      let latestKey = "";

      Object.values(hourlyData).forEach(deviceHours => {
        if (typeof deviceHours === 'object' && deviceHours !== null) {
          Object.keys(deviceHours).forEach(timeKey => {
            if (timeKey > latestKey) {
              latestKey = timeKey;
            }
          });
        }
      });

      if (!latestKey) return null;

      const [datePart, hourPart] = latestKey.split(' ');
      const [year, month, day] = datePart.split('-').map(Number);
      return new Date(year, month - 1, day, parseInt(hourPart, 10), 59, 59).getTime();
    } catch (e) {
      return null;
    }
  }

  /**
   * Main Status Check & UI Dynamic Router
   */
  async function checkGistStatus() {
    const gistId = document.getElementById('gistId').value.trim();
    const exportOptions = document.getElementById('exportOptionsArea');

    if (!gistId) {
      renderSummary('WARNING', 'Missing Configuration', 'Please enter a Gist ID in settings.', []);
      setButtonState('btn-disabled', '⚠️ Gist ID Missing', true, null);
      exportOptions.classList.add('hidden');
      return;
    }

    try {
      const response = await fetch(`https://api.github.com/gists/${gistId}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}: Invalid Gist ID`);

      const data = await response.json();
      const gistUpdatedAt = new Date(data.updated_at).getTime();
      const localSyncTs = localStorage.getItem(LOCAL_SYNC_KEY) ? new Date(localStorage.getItem(LOCAL_SYNC_KEY)).getTime() : 0;

      const backupFile = data.files['ecoflow_backup.json'];
      const sizeInBytes = backupFile ? backupFile.size : 0;
      const sizeInKB = (sizeInBytes / 1024).toFixed(2);

      const GRACE_PERIOD_MS = 20000;
      const isRemoteNewer = (gistUpdatedAt - localSyncTs) > GRACE_PERIOD_MS;

      const latestDataTs = getLatestDataTimestamp();
      const hasNewLocalData = latestDataTs && (!localSyncTs || latestDataTs > localSyncTs);

      adjustUIForRole();

      if (!localSyncTs || isRemoteNewer) {
        // CASE 1: Cloud data is newer -> IMPORT ACTION (GREEN)
        exportOptions.classList.add('hidden');
        setButtonState('btn-success', '📥 Update LocalStorage', false, () => triggerImport(gistId));

        renderSummary('INFO', 'New Cloud Data Detected', 'Remote backup is newer than local state.', [
          ['Gist Updated', new Date(gistUpdatedAt).toLocaleString()],
          ['Gist Size', `${sizeInKB} KB`],
          ['Local Sync State', localSyncTs ? new Date(localSyncTs).toLocaleString() : 'None'],
          ['Status', '📥 Import Available']
        ]);

      } else if (hasNewLocalData) {
        // CASE 2: Local data is newer -> EXPORT ACTION (ORANGE/WARNING)
        const hasToken = !!document.getElementById('githubToken').value.trim();
        
        if (hasToken) {
          exportOptions.classList.remove('hidden');
          setButtonState('btn-warning', '📤 Update Gist', false, () => triggerExport(gistId));
        } else {
          exportOptions.classList.add('hidden');
          setButtonState('btn-disabled', '🔒 Read-Only Device (New Local Data)', true, null);
        }

        const formattedLatestData = `<span style="color: var(--success); font-weight: 600;">${new Date(latestDataTs).toLocaleString()}</span>`;

        renderSummary('SUCCESS', 'New Local Data Ready', 'New local readings available for upload.', [
          ['Gist Updated', new Date(gistUpdatedAt).toLocaleString()],
          ['Gist Size', `${sizeInKB} KB`],
          ['Local Sync State', new Date(localSyncTs).toLocaleString()],
          ['Latest Data Point', formattedLatestData],
          ['Status', '📤 Ready for Export']
        ]);

      } else {
        // CASE 3: Fully Synced
        exportOptions.classList.add('hidden');
        setButtonState('btn-disabled', '✅ Local Data Fully Synced', true, null);

        const formattedLatestData = latestDataTs ? new Date(latestDataTs).toLocaleString() : 'N/A';

        renderSummary('SUCCESS', 'Fully Synced', 'Local data is up-to-date with Gist cloud.', [
          ['Gist Updated', new Date(gistUpdatedAt).toLocaleString()],
          ['Gist Size', `${sizeInKB} KB`],
          ['Local Sync State', new Date(localSyncTs).toLocaleString()],
          ['Latest Data Point', formattedLatestData],
          ['Status', '✅ Fully Synced']
        ]);
      }

    } catch (err) {
      exportOptions.classList.add('hidden');
      setButtonState('btn-disabled', '❌ Connection Error', true, null);
      renderSummary('DANGER', 'Sync Check Failed', err.message, []);
    }
  }

  function setButtonState(className, text, disabled, onClickHandler) {
    const btn = document.getElementById('mainActionBtn');
    btn.className = `btn ${className}`;
    btn.textContent = text;
    btn.disabled = disabled;
    
    // Replace event listeners cleanly
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);

    if (onClickHandler && !disabled) {
      newBtn.addEventListener('click', onClickHandler);
    }
  }

  function renderSummary(badgeType, badgeText, message, details) {
    const badgeContainer = document.getElementById('statusBadgeContainer');
    const content = document.getElementById('summaryContent');

    const badgeClass = badgeType === 'SUCCESS' ? 'badge-success' : badgeType === 'DANGER' ? 'badge-danger' : badgeType === 'WARNING' ? 'badge-warning' : 'badge-info';

    badgeContainer.innerHTML = `<span class="badge ${badgeClass}">${badgeText}</span>`;

    let tableRows = details.map(([label, val]) => `
      <tr>
        <td>${label}</td>
        <td>${val}</td>
      </tr>
    `).join('');

    content.innerHTML = `
      <div style="margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted);">${message}</div>
      ${details.length > 0 ? `<table class="summary-table">${tableRows}</table>` : ''}
    `;
  }

  async function triggerImport(gistId) {
    const btn = document.getElementById('mainActionBtn');
    btn.textContent = '⏳ Importing...';
    btn.disabled = true;

    try {
      const response = await fetch(`https://api.github.com/gists/${gistId}`);
      if (!response.ok) throw new Error('Failed to fetch Gist data');

      const data = await response.json();
      const backupFile = data.files['ecoflow_backup.json'];
      if (!backupFile) throw new Error('ecoflow_backup.json not found in Gist');

      let payload = JSON.parse(backupFile.content);
      
      // Standardize strictly on GitHub official server timestamp
      const officialGistTimestamp = data.updated_at;

      // Restore payload items into localStorage
      if (payload.data) {
        Object.keys(payload.data).forEach(key => {
          const val = typeof payload.data[key] === 'object' ? JSON.stringify(payload.data[key]) : payload.data[key];
          localStorage.setItem(key, val);
        });
      }

      localStorage.setItem(LOCAL_SYNC_KEY, officialGistTimestamp);
      
      // Automatically refresh UI status post-import
      await checkGistStatus();
    } catch (err) {
      alert(`Import failed: ${err.message}`);
      checkGistStatus();
    }
  }

  async function triggerExport(gistId) {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) {
      alert('GitHub Token required for export!');
      return;
    }

    const btn = document.getElementById('mainActionBtn');
    btn.textContent = '⏳ Uploading...';
    btn.disabled = true;

    try {
      const keys = document.getElementById('storageKeys').value.split(',').map(k => k.trim());
      const exportData = {};

      keys.forEach(key => {
        const item = localStorage.getItem(key);
        if (item) {
          try { exportData[key] = JSON.parse(item); } catch (e) { exportData[key] = item; }
        }
      });

      const payload = {
        timestamp: new Date().toISOString(),
        data: exportData
      };

      const response = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          files: {
            'ecoflow_backup.json': {
              content: JSON.stringify(payload, null, 2)
            }
          }
        })
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}: Export failed`);

      const resData = await response.json();
      const officialGistTimestamp = resData.updated_at;

      // Always save official GitHub timestamp to local state
      localStorage.setItem(LOCAL_SYNC_KEY, officialGistTimestamp);

      // Automatically refresh UI status post-export
      await checkGistStatus();
    } catch (err) {
      alert(`Export failed: ${err.message}`);
      checkGistStatus();
    }
  }
</script>

</body>
</html>
