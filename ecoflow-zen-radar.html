<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFlow Solar Zen Radar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #060c1a;
            color: #e0f0ff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            background: #0d182b;
            color: #e0f0ff;
            border: 1px solid rgba(107, 138, 170, 0.3);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.primary {
            background: #2ecc71;
            color: #060c1a;
            font-weight: bold;
            border: none;
        }
        button.primary:hover {
            background: #27ae60;
            transform: scale(1.05);
        }
        select:focus, button:focus {
            outline: 1px solid #2ecc71;
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
        }
        #info {
            font-size: 0.9rem;
            color: #8b9eb3;
            font-variant-numeric: tabular-nums;
            min-height: 2.2em;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="controls" id="controlPanel">
            <select id="inverterSelect">
                <option value="combined">🌐 Total Property (Combined)</option>
            </select>
            <button id="startBtn" class="primary">☀️🎧 Start Zen Radar</button>
        </div>
        <div id="info">Select mode and start radar...</div>
    </div>

    <canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const inverterSelect = document.getElementById('inverterSelect');
    const infoDiv = document.getElementById('info');

    let width, height, cx, cy;
    let allInvertersData = {};
    let currentDataset = [];
    let currentDatasetName = '';
    let isPlaying = false;
    let audioCtx = null;
    let currentAngle = 0;
    let playlistKeys = [];
    let playlistIndex = 0;

    const pentatonicScale = [196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        cx = width / 2;
        cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Load all inverters from localStorage
    function loadData() {
        allInvertersData = {};
        let rawStorage = null;
        let customNames = {};

        try {
            rawStorage = localStorage.getItem('ecoflow_wh');
            customNames = JSON.parse(localStorage.getItem('ecoflow_names')) || {};
        } catch(e) { console.log("Error reading localStorage"); }

        if (rawStorage) {
            try {
                const parsed = JSON.parse(rawStorage);
                const serials = Object.keys(parsed);
                
                if (serials.length > 0) {
                    serials.forEach(sn => {
                        const name = customNames[sn] || `Inverter (${sn.substring(0, 6)}...)`;
                        const daysObj = parsed[sn];
                        const days = Object.keys(daysObj).sort();
                        allInvertersData[sn] = {
                            name: name,
                            data: days.map(d => ({ date: d, yield: daysObj[d] }))
                        };
                    });
                }
            } catch(e) { console.error("Parsing error", e); }
        }

        // Fallback if no data is found in localStorage
        if (Object.keys(allInvertersData).length === 0) {
            let mockData = [];
            for(let i = 0; i < 365; i++) {
                let base = Math.sin((i / 365) * Math.PI) * 1500;
                mockData.push({ date: `Day ${i}`, yield: Math.max(0, base + Math.random() * 400) });
            }
            allInvertersData['mock_1'] = { name: 'Simulator A', data: mockData };
            let mockData2 = [];
            for(let i = 0; i < 365; i++) {
                let base = Math.sin((i / 365) * Math.PI) * 1200;
                mockData2.push({ date: `Day ${i}`, yield: Math.max(0, base + Math.random() * 300) });
            }
            allInvertersData['mock_2'] = { name: 'Simulator B', data: mockData2 };
        }

        // Populate Dropdown cleanly
        inverterSelect.innerHTML = '<option value="combined">🌐 Total Property (Combined)</option>';
        inverterSelect.innerHTML += '<option value="playlist">🔄 Sequential Playlist (All Devices)</option>';
        
        Object.keys(allInvertersData).forEach(sn => {
            const opt = document.createElement('option');
            opt.value = sn;
            opt.textContent = `⚡ ${allInvertersData[sn].name}`;
            inverterSelect.appendChild(opt);
        });
    }

    function getCombinedData() {
        const dateMap = {};
        Object.keys(allInvertersData).forEach(sn => {
            allInvertersData[sn].data.forEach(item => {
                dateMap[item.date] = (dateMap[item.date] || 0) + item.yield;
            });
        });
        const sortedDates = Object.keys(dateMap).sort();
        return sortedDates.map(d => ({ date: d, yield: dateMap[d] }));
    }

    function selectDataset(key) {
        if (key === 'combined') {
            currentDataset = getCombinedData();
            currentDatasetName = 'Total Property';
        } else if (key === 'playlist') {
            playlistKeys = Object.keys(allInvertersData);
            playlistIndex = 0;
            loadPlaylistCurrent();
            return;
        } else {
            currentDataset = allInvertersData[key].data;
            currentDatasetName = allInvertersData[key].name;
        }
        window.lastPlayedIndex = -1;
    }

    function loadPlaylistCurrent() {
        if (playlistKeys.length === 0) return;
        const sn = playlistKeys[playlistIndex];
        currentDataset = allInvertersData[sn].data;
        currentDatasetName = `[${playlistIndex + 1}/${playlistKeys.length}] ${allInvertersData[sn].name}`;
        window.lastPlayedIndex = -1;
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(yieldValue, maxYield) {
        if (!audioCtx) return;
        const normalizedYield = Math.min(1, yieldValue / maxYield);
        const noteIndex = Math.floor(normalizedYield * (pentatonicScale.length - 1));
        const freq = pentatonicScale[noteIndex];

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.15 * normalizedYield, audioCtx.currentTime + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
    }

    function draw() {
        if (!isPlaying) return;

        ctx.fillStyle = 'rgba(6, 12, 26, 0.15)';
        ctx.fillRect(0, 0, width, height);

        const radius = Math.min(width, height) * 0.15;
        const maxRadius = Math.min(width, height) * 0.45;
        
        if (!currentDataset || currentDataset.length === 0) return;
        const maxYield = Math.max(...currentDataset.map(d => d.yield)) || 1;

        const totalPoints = currentDataset.length;
        const angleStep = (Math.PI * 2) / totalPoints;

        currentAngle += 0.015;
        
        if (currentAngle > Math.PI * 2) {
            currentAngle -= Math.PI * 2;
            if (inverterSelect.value === 'playlist' && playlistKeys.length > 1) {
                playlistIndex = (playlistIndex + 1) % playlistKeys.length;
                loadPlaylistCurrent();
            }
        }

        let currentIndex = Math.floor((currentAngle / (Math.PI * 2)) * totalPoints);
        
        currentDataset.forEach((point, i) => {
            const angle = i * angleStep;
            const length = radius + (point.yield / maxYield) * (maxRadius - radius);

            const x1 = cx + Math.cos(angle) * radius;
            const y1 = cy + Math.sin(angle) * radius;
            const x2 = cx + Math.cos(angle) * length;
            const y2 = cy + Math.sin(angle) * length;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            
            if (i === currentIndex) {
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 3;
                
                if (window.lastPlayedIndex !== currentIndex) {
                    playTone(point.yield, maxYield);
                    window.lastPlayedIndex = currentIndex;
                    infoDiv.innerHTML = `<b>${currentDatasetName}</b><br>${point.date} — <b>${(point.yield/1000).toFixed(2)} kWh</b>`;
                }
            } else {
                const hue = 200 - ((point.yield / maxYield) * 140);
                ctx.strokeStyle = `hsla(${hue}, 80%, 50%, 0.4)`;
                ctx.lineWidth = 2;
            }
            
            ctx.stroke();
        });

        requestAnimationFrame(draw);
    }

    loadData();

startBtn.addEventListener('click', () => {
        if (!isPlaying) {
            initAudio();
            selectDataset(inverterSelect.value);
            isPlaying = true;
            startBtn.textContent = 'Stop / Reset';
            startBtn.style.background = '#e74c3c'; // Rot für Stop
            infoDiv.innerHTML = 'Synchronizing radar orbit...';
            draw();
        } else {
            isPlaying = false;
            startBtn.textContent = 'Start Zen Radar';
            startBtn.style.background = '#2ecc71'; // Grün für Start
            inverterSelect.disabled = false;
            infoDiv.innerHTML = 'Radar paused.';
        }
    });

    // Im Dropdown-Change dataset switch
    inverterSelect.addEventListener('change', () => {
        if (isPlaying) {
            selectDataset(inverterSelect.value);
        }
    });
</script>

</body>
</html>
